spring.application.name=Customer-ai-biz
spring.config.import=optional:file:.env[.properties]
# ?????
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/customer_ai?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? SQL ????
# ??????? SQL ???????
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# --- AI ?? ---
# Qwen API (DashScope OpenAI-compatible endpoint)
ai.api.url=${QWEN_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
# ?? API Key (???????????? Key)
ai.api.key=${DASHSCOPE_API_KEY:}
# ???????
ai.model=${QWEN_MODEL:qwen3.6-plus}
ai.api.timeout-ms=${QWEN_API_TIMEOUT_MS:30000}

# AI Agent workflow service. Start ai-service locally on port 8090 for full RAG/workflow output.
ai.agent.enabled=${AI_AGENT_ENABLED:true}
ai.agent.url=${AI_AGENT_SERVICE_URL:http://127.0.0.1:8090/agent/work-order}
ai.agent.timeout-ms=${AI_AGENT_TIMEOUT_MS:30000}
